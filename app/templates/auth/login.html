<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Match Assistant</title>
</head>

<body>

    <h1>SMART MATCH ASSISTANT</h1>

    <h2>Login</h2>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endwith %}


    <form method="POST">

        <!-- CSRF Protection -->
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label>Email:</label><br>

        <input
            type="email"
            name="email"
            required
        >

        <br><br>


        <label>Password:</label><br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>


        <button type="submit">
            Login
        </button>

    </form>

</body>

</html>
