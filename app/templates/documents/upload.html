<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload Document - Smart Match Assistant</title>

</head>


<body>


    <h1>
        SMART MATCH ASSISTANT
    </h1>


    <h2>
        Upload Document
    </h2>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <p>
                {{ message }}
            </p>

        {% endfor %}

    {% endwith %}


    <p>
        Select a document for matching.
    </p>


    <form
        method="POST"
        enctype="multipart/form-data"
    >


        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <input
            type="file"
            name="file"
            accept=".xlsx,.docx,.pdf,.txt,.png,.jpg,.jpeg,.exe"
            required
        >


        <br><br>


        <button type="submit">
            Upload Document
        </button>


    </form>


    <br>


    <a href="{{ url_for('auth.dashboard') }}">
        Back to Dashboard
    </a>


</body>

</html>
