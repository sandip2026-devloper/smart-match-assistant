<!DOCTYPE html>
<html>
<head>
    <title>Match Documents - Smart Match Assistant</title>
</head>
<body>

    <h1>Match Documents</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="main_document_id">
            Main Document:
        </label>

        <select name="main_document_id" id="main_document_id" required>
            <option value="">Select Main Document</option>

            {% for document in documents %}
                <option value="{{ document.id }}">
                    {{ document.original_name }}
                    (ID: {{ document.id }})
                </option>
            {% endfor %}

        </select>

        <br><br>

        <label for="secondary_document_id">
            Secondary Document:
        </label>

        <select
            name="secondary_document_id"
            id="secondary_document_id"
            required
        >
            <option value="">Select Secondary Document</option>

            {% for document in documents %}
                <option value="{{ document.id }}">
                    {{ document.original_name }}
                    (ID: {{ document.id }})
                </option>
            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Match Documents
        </button>

    </form>

    <br>

    <a href="{{ url_for('auth.dashboard') }}">
        Back to Dashboard
    </a>

</body>
</html>
